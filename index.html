<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todos os Packs da Steam</title>
    <link rel="shortcut icon" href="/img/logo2.png" type="image/x-icon" />
    <link rel="stylesheet" href="./Styles/reset.css" />
    <link rel="stylesheet" href="./Styles/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"

    <header class="header">
      <div class="title-container">
        <h1>
          <img src="/img/logo2.png" />Steam Bundle Set<img

    <footer>
      <section class="footer-container"></section>
    </footer>

    <script type="module" src="/JS/script.js"></script>
